<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEXA BENZENE ADMIN PANEL</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.5); position: relative; }
        h2 { text-align: center; color: #ffcc00; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ccc; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; box-sizing: border-box; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { background: #ff4757; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
        button:hover { background: #ff6b81; }
        .file-status { font-size: 13px; color: #00ffcc; margin-top: 5px; }
        
        /* সফল বার্তা (Toast) এর জন্য স্টাইল */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #2ed573;
            color: white;
            text-align: center;
            border-radius: 4px;
            padding: 12px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }
        @keyframes fadeout {
            from { bottom: 30px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>HEXA BENZENE ADMIN PANEL</h2>
    
    <div class="form-group">
        <label>ম্যাচের নাম (Match Name):</label>
        <input type="text" id="matchName" placeholder="যেমন: Match 1 - Bermuda">
    </div>

    <div class="form-group">
        <label>টিম ১ নাম (Team 1 Name):</label>
        <input type="text" id="team1Name" value="HEXA BENZENE">
    </div>
    
    <div class="form-group">
        <label id="team1Label">টিম ১ লোগো (ফাইল চুজ করুন):</label>
        <input type="file" id="team1Logo" onchange="handleLogoChange(1)">
        <div id="team1Status" class="file-status">কোনো ফাইল নির্বাচিত হয়নি</div>
    </div>

    <button onclick="saveLeaderboardData()">ওকে (সংরক্ষণ করুন)</button>
</div>

<!-- সফল বার্তা (Toast Notification) -->
<div id="toast">সফলভাবে আপনার লিডারবোর্ডের কাজ সম্পন্ন হয়েছে!</div>

<script>
    // ডাটাবেজ থেকে লোগো চেক করার ফাংশন
    function checkExistingLogo(teamNum, logoUrl) {
        const labelElem = document.getElementById(`team` + teamNum + `Label`);
        const statusElem = document.getElementById(`team` + teamNum + `Status`);
        
        if (logoUrl && logoUrl.trim() !== "") {
            labelElem.innerText = `টিম ` + teamNum + ` লোগো (ফাইল রিপ্লেস করুন):`;
            statusElem.innerHTML = `১টি ফাইল ইতিমধ্যে বিদ্যমান আছে। <a href="${logoUrl}" target="_blank" style="color: #ffcc00;">লোগো দেখুন</a>`;
        } else {
            labelElem.innerText = `টিম ` + teamNum + ` লোগো (ফাইল চুজ করুন):`;
            statusElem.innerText = `কোনো ফাইল নির্বাচিত হয়নি`;
        }
    }

    function handleLogoChange(teamNum) {
        const fileInput = document.getElementById(`team` + teamNum + `Logo`);
        const statusElem = document.getElementById(`team` + teamNum + `Status`);
        if (fileInput.files.length > 0) {
            statusElem.innerText = `নতুন ফাইল নির্বাচিত হয়েছে: ` + fileInput.files[0].name;
        }
    }

    function saveLeaderboardData() {
        // ফায়ারবেজে ডেটা সেভ করার কোড এখানে থাকবে
        showToast();
    }

    function showToast() {
        const toast = document.getElementById("toast");
        toast.className = "show";
        setTimeout(function(){ 
            toast.className = toast.className.replace("show", ""); 
        }, 3000);
    }
</script>

</body>
</html>
