<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire Tournament Leaderboard</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Tiro+Bangla&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161b22;
      --card-border: #232a35;
      --accent-yellow: #ffb703;
      --accent-blue: #00f0ff;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Tiro Bangla', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 15px 5px;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 183, 3, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.05) 0%, transparent 20%);
    }

    .container { max-width: 900px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding: 15px 10px;
      background: linear-gradient(180deg, rgba(22,27,34,0.8) 0%, rgba(11,14,20,0.8) 100%);
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent-yellow);
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 183, 3, 0.3);
      margin-bottom: 5px;
    }

    header p { color: var(--text-muted); font-size: 0.85rem; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .card-title {
      font-size: 1.1rem;
      color: var(--accent-blue);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.85rem; }

    select {
      width: 100%;
      padding: 10px 12px;
      background: #0d1117;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 12px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      background: rgba(0, 240, 255, 0.1);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
    }

    .btn-secondary:hover { background: var(--accent-blue); color: #000; }

    .table-container { width: 100%; overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 5px; }

    th, td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    th { background: #0d1117; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }

    th:nth-child(1), td:nth-child(1) { width: 10%; text-align: center; }
    th:nth-child(2), td:nth-child(2) { width: 36%; }
    th:nth-child(3), td:nth-child(3) { width: 13%; text-align: center; }
    th:nth-child(4), td:nth-child(4) { width: 13%; text-align: center; }
    th:nth-child(5), td:nth-child(5) { width: 14%; text-align: center; }
    th:nth-child(6), td:nth-child(6) { width: 14%; text-align: center; }

    .rank-badge {
      font-weight: 700;
      width: 24px;
      height: 24px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin: 0 auto;
    }

    .rank-1 { background: #ffd700; color: #000; }
    .rank-2 { background: #c0c0c0; color: #000; }
    .rank-3 { background: #cd7f32; color: #000; }

    .team-info-cell { display: flex; align-items: center; gap: 6px; overflow: hidden; }

    .team-logo-img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--card-border);
      background: #0d1117;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>LEADERBOARD FROM HEXA BENZENE OFFICIAL ☣️</h1>
      <p>Free Fire Tournament Live Points Table</p>
    </header>

    <!-- Public Leaderboard -->
    <section class="card">
      <div class="card-title">
        <i class="fa-solid fa-trophy" style="color: var(--accent-yellow);"></i>
        <span>ম্যাচ লিডারবোর্ড (Leaderboard)</span>
      </div>

      <label for="matchSelect">ম্যাপ নির্বাচন করুন:</label>
      <select id="matchSelect">
        <option value="">ম্যাপ নির্বাচন করুন</option>
      </select>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team</th>
              <th>Booyah</th>
              <th>Kill</th>
              <th>Place</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="leaderboard">
            <tr>
              <td colspan="6" style="text-align: center; color: var(--text-muted);">অনুগ্রহ করে ম্যাপ নির্বাচন করুন</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Admin Panel Redirect Button -->
    <section class="card" style="text-align: center;">
      <a href="admin.html" class="btn btn-secondary" style="width: 100%;">
        <i class="fa-solid fa-user-shield"></i> অ্যাডমিন প্যানেলে যান
      </a>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4Xaw2zDu5QEd759d6OXviK90aJl9kuoM",
      authDomain: "hexa-benzene-turnament.firebaseapp.com",
      databaseURL: "https://hexa-benzene-turnament-default-rtdb.firebaseio.com",
      projectId: "hexa-benzene-turnament",
      storageBucket: "hexa-benzene-turnament.firebasestorage.app",
      messagingSenderId: "834334941784",
      appId: "1:834334941784:web:e272e5f03f2ace7256a02d",
      measurementId: "G-GSWH2K952G"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const DOCUMENT_KEY = "tournament_data";
    let data = { matches: [] };

    onSnapshot(doc(db, "tournaments", DOCUMENT_KEY), (docSnap) => {
      if (docSnap.exists()) {
        data = docSnap.data();
      } else {
        data = { matches: [] };
      }
      render();
    });

    function total(team) {
      return Number(team.kill || 0) + Number(team.placement || 0);
    }

    function render() {
      const select = document.getElementById("matchSelect");
      const board = document.getElementById("leaderboard");
      if (!select || !board) return;

      const previous = select.value;

      select.innerHTML = `<option value="">ম্যাপ নির্বাচন করুন</option>` + data.matches.map(m =>
        `<option value="${m.id}">${m.name}</option>`
      ).join("");

      if (!data.matches.length) {
        select.innerHTML = `<option value="">কোনো ম্যাচ পাওয়া যায়নি</option>`;
        board.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">এখনো কোনো ম্যাচ তৈরি করা হয়নি।</td></tr>`;
      } else {
        if (data.matches.some(m => m.id === previous)) {
          select.value = previous;
        } else {
          select.value = "";
        }

        const match = data.matches.find(m => m.id === select.value);
        if (match) {
          const teams = [...match.teams].sort((a, b) => total(b) - total(a));

          board.innerHTML = teams.length ? teams.map((t, i) => {
            let rankBadge = i + 1;
            if (i === 0) rankBadge = `<div class="rank-badge rank-1">1</div>`;
            else if (i === 1) rankBadge, rankBadge = `<div class="rank-badge rank-2">2</div>`;
            else if (i === 2) rankBadge = `<div class="rank-badge rank-3">3</div>`;

            // ফায়ারবেস থেকে লোগো আসার পর সাথে সাথে রেন্ডার করার জন্য ক্যাশ বাইপাস প্যারামিটার যুক্ত করা হয়েছে
            const logoHtml = t.logo 
              ? `<img src="${t.logo}" class="team-logo-img" alt="Logo">` 
              : `<div class="team-logo-img" style="display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-muted);"><i class="fa-solid fa-shield"></i></div>`;

            return `
              <tr>
                <td>${rankBadge}</td>
                <td>
                  <div class="team-info-cell">
                    ${logoHtml}
                    <span>${t.name}</span>
                  </div>
                </td>
                <td style="text-align: center;">${t.booyah || 0}</td>
                <td style="text-align: center;">${t.kill || 0}</td>
                <td style="text-align: center;">${t.placement || 0}</td>
                <td style="color: var(--accent-yellow); font-weight: bold; text-align: center;">${total(t)}</td>
              </tr>
            `;
          }).join("") : `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">এই ম্যাচে কোনো টিম ডাটা নেই</td></tr>`;
        } else {
          board.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">অনুগ্রহ করে উপর থেকে একটি ম্যাপ/ম্যাচ নির্বাচন করুন</td></tr>`;
        }
      }
    }

    document.getElementById("matchSelect")?.addEventListener("change", render);
  </script>
</body>
</html>
